name: npm

# Runs the tests, then publishes the npm package. It runs in three cases:
#   1. A GitHub release is published. The release tag must equal the version in package.json (v0.1.1 for 0.1.1).
#   2. A push to main changes the package. It publishes only if that version is new on npm,
#      so a push without a version bump publishes nothing.
#   3. Manual run: Actions -> npm -> Run workflow, with a tag such as v0.1.1 (leave empty for main).
#
# To release a new version: bump "version" in package.json, plugins/multi-account-netlify/.claude-plugin/plugin.json
# and .claude-plugin/marketplace.json (the tests check that they match), push to main, then publish a GitHub
# release with the tag vX.Y.Z.
#
# Trusted publishing (OIDC): no npm token is stored in GitHub. One-time setup on npmjs.com:
# package multi-account-netlify-mcp -> Settings -> Trusted Publisher -> GitHub Actions:
#   Organization or user: FiredMosquito831
#   Repository:           multi-account-netlify-mcp
#   Workflow filename:    npm.yml
#   Environment:          leave empty

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "README.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/npm.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.1. Leave empty to publish main."
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support (needs 11.5.1 or newer)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$TAG" ]; then
            echo "Push to main: version $VERSION is checked against npm in the next step."
          elif [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION. Fix the tag or the version."
            exit 1
          else
            echo "Tag $TAG matches package.json version $VERSION."
          fi

      - name: Publish when the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm. Bump the version in package.json to publish."
          else
            npm publish --provenance --access public
          fi
